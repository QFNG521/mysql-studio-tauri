name: 发布 macOS 安装包

# 推送 v* 标签时自动构建并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（如 v0.1.0）'
        required: true
        default: v0.1.0

jobs:
  release-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 解析版本号
        id: ver
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # tauri.conf.json 的 beforeBuildCommand 会自动先跑 npm run build
      - name: 打包（.app + .dmg）
        run: npx --no-install tauri build

      - name: 压缩 .app 便于直接下载
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "轻库.app" "轻库_${{ steps.ver.outputs.version }}_aarch64_app.zip"

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 轻库 ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
