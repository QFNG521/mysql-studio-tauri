name: 发布多平台安装包

# 推送 v* 标签时自动构建 macOS / Windows / Linux 安装包并发布 Release；
# 也可在 Actions 页面手动触发并指定标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（如 v0.1.0）'
        required: true
        default: v0.1.0

jobs:
  # 统一解析标签与版本号，供后续 job 使用
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: 解析版本号
        id: v
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: meta
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # tauri.conf.json 的 beforeBuildCommand 会自动先跑 npm run build
      - name: 打包（.app + .dmg）
        run: npx --no-install tauri build

      - name: 压缩 .app 便于直接下载
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "轻库.app" "轻库_${{ needs.meta.outputs.version }}_aarch64_app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: error

  build-windows:
    needs: meta
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # 拆成「编译 / MSI / NSIS」三步：
      # 编译失败与打包失败能一眼区分；NSIS 需联网下载工具链，允许失败但保留 MSI。
      - name: 编译 release
        shell: bash
        run: npx --no-install tauri build --no-bundle

      - name: 打包 MSI
        shell: bash
        run: npx --no-install tauri build --bundles msi

      - name: 打包 NSIS（可失败）
        shell: bash
        continue-on-error: true
        run: npx --no-install tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    needs: meta
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # AppImage 打包依赖外部工具，失败则回退为 deb + rpm
      - name: 打包（deb + rpm + AppImage）
        run: |
          npx --no-install tauri build --bundles deb,rpm,appimage \
            || npx --no-install tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [meta, build-macos, build-windows, build-linux]
    name: 创建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: 轻库 ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 格式 | 说明 |
            |---|---|---|
            | macOS | `.dmg` / `.app.zip` | Apple Silicon（M 系列），macOS 12+ |
            | Windows | `.msi` / `.exe` | x64，Windows 10+ |
            | Linux | `.deb` / `.rpm` / `.AppImage` | x64 |

            同一目录下的 `SHA256SUMS.txt` 提供全部文件的校验和。

            > **macOS**：首次打开若提示「无法验证开发者」，右键应用 → 打开。当前为 adhoc 签名，未经 Apple 公证。
            > **Windows**：SmartScreen 可能对未签名的安装包发出警告，选择「仍要运行」。
            > **Linux**：AppImage 需先 `chmod +x 轻库_*.AppImage` 再运行；deb / rpm 要求系统带有 WebKit2GTK 4.1（Ubuntu 23.04+ / Fedora 38+ 等较新发行版）。

            ## 功能

            - **连接管理**：直连、SSH 隧道（支持私钥认证）、SSL/TLS（CA 验证 / 仅加密 / 双向认证）
            - **SQL 编辑器**（CodeMirror 6）：语法高亮、表名字段自动补全、多语句执行
            - **查询页**：编辑器与结果区可拖拽调高、结果区可隐藏，窗口最大化时充满屏幕
            - **表结构设计**：列 / 索引 / 外键可视化编辑，生成并执行 ALTER
            - **数据浏览**：分页、筛选排序、行内编辑，支持外键跳转
            - **导出**：CSV / JSON / Excel 三种格式（JSON 保留数据类型，Excel 表头冻结、数值列可直接求和）
            - 深浅色主题

            详细特性见 [README](https://github.com/QFNG521/mysql-studio-tauri#readme)。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
